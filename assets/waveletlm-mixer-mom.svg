<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 908" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fafafa; stroke: #444; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #222; }
      .sub-box { fill: #ffffff; stroke: #3a5a8c; stroke-width: 1; }
      .sub-label { font-size: 13px; font-weight: 500; fill: #222; }
      .ln-box { fill: #ffffff; stroke: #3a5a8c; stroke-width: 0.75; }
      .ln-label { font-size: 10px; font-weight: 500; fill: #555; }
      .node-bg { fill: #eef3fb; stroke: #3a5a8c; stroke-width: 1.5; }
      .node-title { font-size: 11px; font-weight: 700; fill: #3a5a8c; }
      .block-bg { fill: #eef3fb; stroke: #3a5a8c; stroke-width: 2; }
      .block-title { font-size: 13px; font-weight: 700; fill: #3a5a8c; }
      .multinodal-bg { fill: #f4f7fc; stroke: #3a5a8c; stroke-width: 2; stroke-dasharray: 4 3; }
      .arrow { stroke: #444; stroke-width: 1.5; fill: none; }
      .sub-arrow { stroke: #3a5a8c; stroke-width: 1; fill: none; }
      .mini-sub-label { font-size: 12px; font-weight: 500; fill: #222; }
      .ellipsis { font-size: 24px; font-weight: 700; fill: #3a5a8c; }
      .caption { font-size: 11px; font-style: italic; fill: #666; }
    ]]></style>
  </defs>

  <!-- ===== Title ===== -->
  <text x="370" y="28" text-anchor="middle" class="label">WaveletLM with a sparse mixture of mixers (MoM)</text>
  <text x="370" y="46" text-anchor="middle" class="caption">Shared wavelet pipeline; a top-k router activates E parallel gated mixers in the mixer slot</text>

  <!-- ===== Output tokens (TOP) ===== -->
  <rect x="270" y="68" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="88" text-anchor="middle" class="label">Output tokens</text>

  <!-- arrow: LM Head -> Output -->
  <line x1="370" y1="132" x2="370" y2="104" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Tied LM Head ===== -->
  <rect x="270" y="132" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="152" text-anchor="middle" class="label">Tied LM Head</text>

  <!-- arrow: LayerNorm -> LM Head -->
  <line x1="370" y1="203" x2="370" y2="168" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Final LayerNorm (minimized) ===== -->
  <rect x="315" y="203" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="370" y="216" text-anchor="middle" class="ln-label">LayerNorm</text>

  <!-- arrow: Block top -> Final LayerNorm -->
  <line x1="370" y1="260" x2="370" y2="225" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== WaveletLM Block container ===== -->
  <rect x="30" y="260" width="680" height="500" rx="10" ry="10" class="block-bg"/>
  <text x="370" y="284" text-anchor="middle" class="block-title">WaveletLM Block (× N layers)</text>

  <!-- Spine sub-boxes inside the block (output side / top of block, going down) -->

  <!-- Learned Residual (spectral sublayer) -->
  <rect x="210" y="296" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="313" text-anchor="middle" class="sub-label">Learned Residual</text>
  <line x1="370" y1="338" x2="370" y2="324" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Reconstruct -->
  <rect x="210" y="338" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="355" text-anchor="middle" class="sub-label">Lifting Wavelet Reconstruct</text>
  <line x1="370" y1="380" x2="370" y2="366" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_recon_norm: per-scale, after combine, before reconstruct) — minimized -->
  <rect x="315" y="380" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="370" y="393" text-anchor="middle" class="ln-label">LayerNorm</text>
  <line x1="370" y1="414" x2="370" y2="400" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Combine (router-weighted sum of active experts) -->
  <rect x="210" y="414" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="431" text-anchor="middle" class="sub-label">Combine (router-weighted sum)</text>

  <!-- Combiner arrows (fan-IN from each expert's top to Combine bottom, going up) -->
  <line x1="115" y1="476" x2="115" y2="456" class="sub-arrow"/>
  <line x1="225" y1="476" x2="225" y2="456" class="sub-arrow"/>
  <line x1="370" y1="476" x2="370" y2="456" class="sub-arrow"/>
  <line x1="520" y1="476" x2="520" y2="456" class="sub-arrow"/>
  <line x1="650" y1="476" x2="650" y2="456" class="sub-arrow"/>
  <line x1="115" y1="456" x2="650" y2="456" class="sub-arrow"/>
  <line x1="370" y1="456" x2="370" y2="442" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- ===== Expert container (dashed) ===== -->
  <rect x="50" y="464" width="640" height="120" rx="8" ry="8" class="multinodal-bg"/>

  <!-- ===== Expert 1 ===== -->
  <rect x="70" y="476" width="90" height="88" rx="6" ry="6" class="node-bg"/>
  <text x="115" y="494" text-anchor="middle" class="node-title">Expert 1</text>
  <rect x="78" y="504" width="74" height="46" rx="4" ry="4" class="sub-box"/>
  <text x="115" y="523" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="115" y="539" text-anchor="middle" class="mini-sub-label">Mixer</text>

  <!-- ===== Expert 2 ===== -->
  <rect x="180" y="476" width="90" height="88" rx="6" ry="6" class="node-bg"/>
  <text x="225" y="494" text-anchor="middle" class="node-title">Expert 2</text>
  <rect x="188" y="504" width="74" height="46" rx="4" ry="4" class="sub-box"/>
  <text x="225" y="523" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="225" y="539" text-anchor="middle" class="mini-sub-label">Mixer</text>

  <!-- ===== Expert 3 ===== -->
  <rect x="325" y="476" width="90" height="88" rx="6" ry="6" class="node-bg"/>
  <text x="370" y="494" text-anchor="middle" class="node-title">Expert 3</text>
  <rect x="333" y="504" width="74" height="46" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="523" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="370" y="539" text-anchor="middle" class="mini-sub-label">Mixer</text>

  <!-- ===== Expert 4 ===== -->
  <rect x="475" y="476" width="90" height="88" rx="6" ry="6" class="node-bg"/>
  <text x="520" y="494" text-anchor="middle" class="node-title">Expert 4</text>
  <rect x="483" y="504" width="74" height="46" rx="4" ry="4" class="sub-box"/>
  <text x="520" y="523" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="520" y="539" text-anchor="middle" class="mini-sub-label">Mixer</text>

  <!-- ===== Ellipsis ===== -->
  <text x="595" y="526" text-anchor="middle" class="ellipsis">···</text>

  <!-- ===== Expert E ===== -->
  <rect x="620" y="476" width="60" height="88" rx="6" ry="6" class="node-bg"/>
  <text x="650" y="494" text-anchor="middle" class="node-title">Expert E</text>
  <rect x="626" y="504" width="48" height="46" rx="4" ry="4" class="sub-box"/>
  <text x="650" y="523" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="650" y="539" text-anchor="middle" class="mini-sub-label">Mixer</text>

  <!-- Router fan-OUT (top-k active experts; from router top up into each expert's bottom) -->
  <line x1="370" y1="610" x2="370" y2="598" class="sub-arrow"/>
  <line x1="115" y1="598" x2="650" y2="598" class="sub-arrow"/>
  <line x1="115" y1="598" x2="115" y2="568" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="225" y1="598" x2="225" y2="568" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="370" y1="598" x2="370" y2="568" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="520" y1="598" x2="520" y2="568" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="650" y1="598" x2="650" y2="568" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Top-k Router -->
  <rect x="210" y="610" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="627" text-anchor="middle" class="sub-label">Top-k Router (per scale)</text>
  <line x1="370" y1="652" x2="370" y2="638" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_decomp_norm: per-scale, after decompose) — minimized -->
  <rect x="315" y="652" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="370" y="665" text-anchor="middle" class="ln-label">LayerNorm</text>
  <line x1="370" y1="686" x2="370" y2="672" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Decompose -->
  <rect x="210" y="686" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="703" text-anchor="middle" class="sub-label">Lifting Wavelet Decompose</text>
  <line x1="370" y1="728" x2="370" y2="714" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (ln1, input side, bottom of block) — minimized -->
  <rect x="315" y="728" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="370" y="741" text-anchor="middle" class="ln-label">LayerNorm</text>

  <!-- arrow: Embedding -> Block (entering input side) -->
  <line x1="370" y1="792" x2="370" y2="764" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Learned Embedding ===== -->
  <rect x="270" y="792" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="812" text-anchor="middle" class="label">Learned Embedding (C)</text>

  <!-- arrow: Input tokens -> Embedding -->
  <line x1="370" y1="856" x2="370" y2="828" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Input tokens (BOTTOM) ===== -->
  <rect x="270" y="856" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="876" text-anchor="middle" class="label">Input tokens</text>
</svg>
