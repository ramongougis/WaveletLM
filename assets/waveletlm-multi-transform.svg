<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fafafa; stroke: #444; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #222; }
      .sub-box { fill: #ffffff; stroke: #3a5a8c; stroke-width: 1; }
      .sub-label { font-size: 13px; font-weight: 500; fill: #222; }
      .node-bg { fill: #eef3fb; stroke: #3a5a8c; stroke-width: 1.5; }
      .node-title { font-size: 11px; font-weight: 700; fill: #3a5a8c; }
      .block-bg { fill: #eef3fb; stroke: #3a5a8c; stroke-width: 2; }
      .block-title { font-size: 13px; font-weight: 700; fill: #3a5a8c; }
      .multinodal-bg { fill: #f4f7fc; stroke: #3a5a8c; stroke-width: 2; stroke-dasharray: 4 3; }
      .multinodal-title { font-size: 13px; font-weight: 700; fill: #3a5a8c; }
      .arrow { stroke: #444; stroke-width: 1.5; fill: none; }
      .sub-arrow { stroke: #3a5a8c; stroke-width: 1; fill: none; }
      .mini-sub-label { font-size: 12px; font-weight: 500; fill: #222; }
      .ellipsis { font-size: 24px; font-weight: 700; fill: #3a5a8c; }
      .caption { font-size: 11px; font-style: italic; fill: #666; }
    ]]></style>
  </defs>

  <!-- ===== Title ===== -->
  <text x="370" y="28" text-anchor="middle" class="label">WaveletLM with multi-transform parallelization</text>
  <text x="370" y="46" text-anchor="middle" class="caption">Shared wavelet pipeline; N parallel transform paths replace the FWHT slot</text>

  <!-- ===== Output tokens (TOP) ===== -->
  <rect x="270" y="68" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="88" text-anchor="middle" class="label">Output tokens</text>

  <!-- arrow: LM Head -> Output -->
  <line x1="370" y1="132" x2="370" y2="104" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== LM Head ===== -->
  <rect x="270" y="132" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="152" text-anchor="middle" class="label">LM Head</text>

  <!-- arrow: LayerNorm -> LM Head -->
  <line x1="370" y1="196" x2="370" y2="168" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Final LayerNorm ===== -->
  <rect x="270" y="196" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="216" text-anchor="middle" class="label">LayerNorm</text>

  <!-- arrow: Block top -> Final LayerNorm -->
  <line x1="370" y1="260" x2="370" y2="232" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== WaveletLM Block container ===== -->
  <rect x="30" y="260" width="680" height="750" rx="10" ry="10" class="block-bg"/>
  <text x="370" y="284" text-anchor="middle" class="block-title">WaveletLM Block (× N layers)</text>

  <!-- Spine sub-boxes inside the block (output side / top of block, going down) -->

  <!-- Learned Residual 2 -->
  <rect x="210" y="296" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="313" text-anchor="middle" class="sub-label">Learned Residual 2</text>
  <line x1="370" y1="338" x2="370" y2="324" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Feedforward Layers (MLP) -->
  <rect x="210" y="338" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="355" text-anchor="middle" class="sub-label">Feedforward Layers (MLP)</text>
  <line x1="370" y1="380" x2="370" y2="366" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (ln2) -->
  <rect x="210" y="380" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="397" text-anchor="middle" class="sub-label">LayerNorm</text>
  <line x1="370" y1="422" x2="370" y2="408" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Learned Residual 1 -->
  <rect x="210" y="422" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="439" text-anchor="middle" class="sub-label">Learned Residual 1</text>
  <line x1="370" y1="464" x2="370" y2="450" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Reconstruct -->
  <rect x="210" y="464" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="481" text-anchor="middle" class="sub-label">Lifting Wavelet Reconstruct</text>
  <line x1="370" y1="506" x2="370" y2="492" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_recon_norm: per-scale, after iFWHT / Combine, before reconstruct) -->
  <rect x="210" y="506" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="523" text-anchor="middle" class="sub-label">LayerNorm</text>
  <line x1="370" y1="548" x2="370" y2="534" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Combine -->
  <rect x="210" y="548" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="565" text-anchor="middle" class="sub-label">Combine (sum or learned gate)</text>

  <!-- Combiner arrows (fan-IN from each column's top to Combine bottom, going up) -->
  <line x1="115" y1="598" x2="115" y2="590" class="sub-arrow"/>
  <line x1="225" y1="598" x2="225" y2="590" class="sub-arrow"/>
  <line x1="370" y1="598" x2="370" y2="590" class="sub-arrow"/>
  <line x1="520" y1="598" x2="520" y2="590" class="sub-arrow"/>
  <line x1="650" y1="598" x2="650" y2="590" class="sub-arrow"/>
  <line x1="115" y1="590" x2="650" y2="590" class="sub-arrow"/>
  <line x1="370" y1="590" x2="370" y2="574" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- ===== Multinodal container (dashed) ===== -->
  <rect x="50" y="598" width="640" height="246" rx="8" ry="8" class="multinodal-bg"/>

  <!-- ===== Node 1: FWHT (flipped: inverse on top, forward on bottom) ===== -->
  <rect x="70" y="610" width="90" height="208" rx="6" ry="6" class="node-bg"/>
  <text x="115" y="626" text-anchor="middle" class="node-title">Node 1</text>
  <rect x="78" y="634" width="74" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="115" y="651" text-anchor="middle" class="mini-sub-label">FWHT</text>
  <text x="115" y="667" text-anchor="middle" class="mini-sub-label">(inverse)</text>
  <line x1="115" y1="688" x2="115" y2="676" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="78" y="688" width="74" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="115" y="705" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="115" y="721" text-anchor="middle" class="mini-sub-label">Mixer</text>
  <line x1="115" y1="742" x2="115" y2="730" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="78" y="742" width="74" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="115" y="759" text-anchor="middle" class="mini-sub-label">FWHT</text>
  <text x="115" y="775" text-anchor="middle" class="mini-sub-label">(forward)</text>

  <!-- ===== Node 2: DHT (flipped) ===== -->
  <rect x="180" y="610" width="90" height="208" rx="6" ry="6" class="node-bg"/>
  <text x="225" y="626" text-anchor="middle" class="node-title">Node 2</text>
  <rect x="188" y="634" width="74" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="225" y="651" text-anchor="middle" class="mini-sub-label">DHT</text>
  <text x="225" y="667" text-anchor="middle" class="mini-sub-label">(inverse)</text>
  <line x1="225" y1="688" x2="225" y2="676" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="188" y="688" width="74" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="225" y="705" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="225" y="721" text-anchor="middle" class="mini-sub-label">Mixer</text>
  <line x1="225" y1="742" x2="225" y2="730" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="188" y="742" width="74" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="225" y="759" text-anchor="middle" class="mini-sub-label">DHT</text>
  <text x="225" y="775" text-anchor="middle" class="mini-sub-label">(Hartley)</text>

  <!-- ===== Node 3: DCT-II/III pair (flipped: DCT-III on top, DCT-II on bottom) ===== -->
  <rect x="290" y="610" width="160" height="208" rx="6" ry="6" class="node-bg"/>
  <text x="370" y="626" text-anchor="middle" class="node-title">Node 3</text>
  <rect x="298" y="634" width="144" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="660" text-anchor="middle" class="mini-sub-label">DCT-III</text>
  <line x1="370" y1="688" x2="370" y2="676" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="298" y="688" width="144" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="705" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="370" y="721" text-anchor="middle" class="mini-sub-label">Mixer</text>
  <line x1="370" y1="742" x2="370" y2="730" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="298" y="742" width="144" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="768" text-anchor="middle" class="mini-sub-label">DCT-II</text>

  <!-- ===== Node 4: Learned 1 (flipped: W₄ᵀ on top, W₄ on bottom) ===== -->
  <rect x="470" y="610" width="100" height="208" rx="6" ry="6" class="node-bg"/>
  <text x="520" y="626" text-anchor="middle" class="node-title">Node 4</text>
  <rect x="478" y="634" width="84" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="520" y="660" text-anchor="middle" class="mini-sub-label">W₄ᵀ</text>
  <line x1="520" y1="688" x2="520" y2="676" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="478" y="688" width="84" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="520" y="705" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="520" y="721" text-anchor="middle" class="mini-sub-label">Mixer</text>
  <line x1="520" y1="742" x2="520" y2="730" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="478" y="742" width="84" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="520" y="759" text-anchor="middle" class="mini-sub-label">W₄</text>
  <text x="520" y="775" text-anchor="middle" class="mini-sub-label">(learned)</text>

  <!-- ===== Ellipsis ===== -->
  <text x="595" y="720" text-anchor="middle" class="ellipsis">···</text>

  <!-- ===== Node N: Learned (flipped: Wₙᵀ on top, Wₙ on bottom) ===== -->
  <rect x="620" y="610" width="60" height="208" rx="6" ry="6" class="node-bg"/>
  <text x="650" y="626" text-anchor="middle" class="node-title">Node N</text>
  <rect x="626" y="634" width="48" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="650" y="660" text-anchor="middle" class="mini-sub-label">Wₙᵀ</text>
  <line x1="650" y1="688" x2="650" y2="676" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="626" y="688" width="48" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="650" y="705" text-anchor="middle" class="mini-sub-label">Gated</text>
  <text x="650" y="721" text-anchor="middle" class="mini-sub-label">Mixer</text>
  <line x1="650" y1="742" x2="650" y2="730" class="sub-arrow" marker-end="url(#ab)"/>
  <rect x="626" y="742" width="48" height="42" rx="4" ry="4" class="sub-box"/>
  <text x="650" y="759" text-anchor="middle" class="mini-sub-label">Wₙ</text>
  <text x="650" y="775" text-anchor="middle" class="mini-sub-label">(learned)</text>

  <!-- Splitter arrows (fan-OUT from LayerNorm/decomp_norm top into each column's bottom) -->
  <line x1="370" y1="866" x2="370" y2="854" class="sub-arrow"/>
  <line x1="115" y1="854" x2="650" y2="854" class="sub-arrow"/>
  <line x1="115" y1="854" x2="115" y2="818" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="225" y1="854" x2="225" y2="818" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="370" y1="854" x2="370" y2="818" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="520" y1="854" x2="520" y2="818" class="sub-arrow" marker-end="url(#ab)"/>
  <line x1="650" y1="854" x2="650" y2="818" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Multinodal container title (rendered after splitter arrows so the background rect masks the central arrow) -->
  <rect x="265" y="823" width="210" height="18" fill="#f4f7fc" stroke="none"/>
  <text x="370" y="836" text-anchor="middle" class="multinodal-title">N parallel transform paths</text>

  <!-- LayerNorm (wavelet_decomp_norm: per-scale, after decompose, before fan-out to transform nodes) -->
  <rect x="210" y="866" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="883" text-anchor="middle" class="sub-label">LayerNorm</text>
  <line x1="370" y1="908" x2="370" y2="894" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Decompose -->
  <rect x="210" y="908" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="925" text-anchor="middle" class="sub-label">Lifting Wavelet Decompose</text>
  <line x1="370" y1="958" x2="370" y2="936" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (ln1, input side, bottom of block) -->
  <rect x="210" y="958" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="370" y="975" text-anchor="middle" class="sub-label">LayerNorm</text>

  <!-- arrow: Embedding -> Block (entering input side) -->
  <line x1="370" y1="1042" x2="370" y2="1014" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Learned Embedding ===== -->
  <rect x="270" y="1042" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="1062" text-anchor="middle" class="label">Learned Embedding (C)</text>

  <!-- arrow: Input tokens -> Embedding -->
  <line x1="370" y1="1106" x2="370" y2="1078" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Input tokens (BOTTOM) ===== -->
  <rect x="270" y="1106" width="200" height="32" rx="6" ry="6" class="box"/>
  <text x="370" y="1126" text-anchor="middle" class="label">Input tokens</text>
</svg>
