<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 670" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fafafa; stroke: #444; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #222; }
      .sub-box { fill: #ffffff; stroke: #3a5a8c; stroke-width: 1; }
      .sub-label { font-size: 13px; font-weight: 500; fill: #222; }
      .ln-box { fill: #ffffff; stroke: #3a5a8c; stroke-width: 0.75; }
      .ln-label { font-size: 10px; font-weight: 500; fill: #555; }
      .block-bg { fill: #eef3fb; stroke: #3a5a8c; stroke-width: 2; }
      .block-title { font-size: 13px; font-weight: 700; fill: #3a5a8c; }
      .arrow { stroke: #444; stroke-width: 1.5; fill: none; }
      .sub-arrow { stroke: #3a5a8c; stroke-width: 1; fill: none; }
    ]]></style>
  </defs>

  <!-- ===== Output tokens (TOP) ===== -->
  <rect x="140" y="20" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="40" text-anchor="middle" class="label">Output tokens</text>

  <!-- arrow: LM Head -> Output -->
  <line x1="290" y1="84" x2="290" y2="56" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Tied LM Head ===== -->
  <rect x="140" y="84" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="104" text-anchor="middle" class="label">Tied LM Head</text>

  <!-- arrow: LayerNorm -> LM Head -->
  <line x1="290" y1="155" x2="290" y2="120" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Final LayerNorm (minimized) ===== -->
  <rect x="235" y="155" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="290" y="168" text-anchor="middle" class="ln-label">LayerNorm</text>

  <!-- arrow: Block -> LayerNorm -->
  <line x1="290" y1="212" x2="290" y2="177" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== WaveletLM Block container ===== -->
  <rect x="100" y="212" width="380" height="302" rx="10" ry="10" class="block-bg"/>
  <text x="290" y="237" text-anchor="middle" class="block-title">WaveletLM Block (× N layers)</text>

  <!-- Sub-components, top of block (output side) -> bottom of block (input side) -->

  <!-- Learned Residual (spectral sublayer) -->
  <rect x="130" y="248" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="265" text-anchor="middle" class="sub-label">Learned Residual</text>
  <line x1="290" y1="290" x2="290" y2="276" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Reconstruct -->
  <rect x="130" y="290" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="307" text-anchor="middle" class="sub-label">Lifting Wavelet Reconstruct</text>
  <line x1="290" y1="332" x2="290" y2="318" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_recon_norm: per-scale, before reconstruct) — minimized -->
  <rect x="235" y="332" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="290" y="345" text-anchor="middle" class="ln-label">LayerNorm</text>
  <line x1="290" y1="366" x2="290" y2="352" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Gated Spectral Mixer -->
  <rect x="130" y="366" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="383" text-anchor="middle" class="sub-label">Gated Spectral Mixer</text>
  <line x1="290" y1="408" x2="290" y2="394" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_decomp_norm: per-scale, after decompose) — minimized -->
  <rect x="235" y="408" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="290" y="421" text-anchor="middle" class="ln-label">LayerNorm</text>
  <line x1="290" y1="442" x2="290" y2="428" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Decompose -->
  <rect x="130" y="442" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="459" text-anchor="middle" class="sub-label">Lifting Wavelet Decompose</text>
  <line x1="290" y1="484" x2="290" y2="470" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (ln1, pre-wavelet block input) — minimized -->
  <rect x="235" y="484" width="110" height="18" rx="4" ry="4" class="ln-box"/>
  <text x="290" y="497" text-anchor="middle" class="ln-label">LayerNorm</text>

  <!-- arrow: Embedding -> Block (entering input side) -->
  <line x1="290" y1="546" x2="290" y2="518" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Learned Embedding ===== -->
  <rect x="140" y="546" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="566" text-anchor="middle" class="label">Learned Embedding (C)</text>

  <!-- arrow: Input tokens -> Embedding -->
  <line x1="290" y1="610" x2="290" y2="582" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Input tokens (BOTTOM) ===== -->
  <rect x="140" y="610" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="630" text-anchor="middle" class="label">Input tokens</text>
</svg>
