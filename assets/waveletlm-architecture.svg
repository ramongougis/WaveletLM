<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 904" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a5a8c"/>
    </marker>
    <style><![CDATA[
      .box { fill: #fafafa; stroke: #444; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 700; fill: #222; }
      .sub-box { fill: #ffffff; stroke: #3a5a8c; stroke-width: 1; }
      .sub-label { font-size: 13px; font-weight: 500; fill: #222; }
      .block-bg { fill: #eef3fb; stroke: #3a5a8c; stroke-width: 2; }
      .block-title { font-size: 13px; font-weight: 700; fill: #3a5a8c; }
      .arrow { stroke: #444; stroke-width: 1.5; fill: none; }
      .sub-arrow { stroke: #3a5a8c; stroke-width: 1; fill: none; }
    ]]></style>
  </defs>

  <!-- ===== Output tokens (TOP) ===== -->
  <rect x="140" y="20" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="40" text-anchor="middle" class="label">Output tokens</text>

  <!-- arrow: LM Head -> Output -->
  <line x1="290" y1="84" x2="290" y2="56" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== LM Head ===== -->
  <rect x="140" y="84" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="104" text-anchor="middle" class="label">LM Head</text>

  <!-- arrow: LayerNorm -> LM Head -->
  <line x1="290" y1="148" x2="290" y2="120" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Final LayerNorm ===== -->
  <rect x="140" y="148" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="168" text-anchor="middle" class="label">LayerNorm</text>

  <!-- arrow: Block -> LayerNorm -->
  <line x1="290" y1="212" x2="290" y2="184" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== WaveletLM Block container ===== -->
  <rect x="100" y="212" width="380" height="536" rx="10" ry="10" class="block-bg"/>
  <text x="290" y="237" text-anchor="middle" class="block-title">WaveletLM Block (× N layers)</text>

  <!-- Sub-components, top of block (output side) -> bottom of block (input side) -->

  <!-- Learned Residual 2 -->
  <rect x="130" y="248" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="265" text-anchor="middle" class="sub-label">Learned Residual 2</text>
  <line x1="290" y1="290" x2="290" y2="276" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Feedforward Layers (MLP) -->
  <rect x="130" y="290" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="307" text-anchor="middle" class="sub-label">Feedforward Layers (MLP)</text>
  <line x1="290" y1="332" x2="290" y2="318" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (ln2, pre-MLP) -->
  <rect x="130" y="332" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="349" text-anchor="middle" class="sub-label">LayerNorm</text>
  <line x1="290" y1="374" x2="290" y2="360" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Learned Residual 1 -->
  <rect x="130" y="374" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="391" text-anchor="middle" class="sub-label">Learned Residual 1</text>
  <line x1="290" y1="416" x2="290" y2="402" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Reconstruct -->
  <rect x="130" y="416" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="433" text-anchor="middle" class="sub-label">Lifting Wavelet Reconstruct</text>
  <line x1="290" y1="458" x2="290" y2="444" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_recon_norm: per-scale, after iFWHT, before reconstruct) -->
  <rect x="130" y="458" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="475" text-anchor="middle" class="sub-label">LayerNorm</text>
  <line x1="290" y1="500" x2="290" y2="486" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Fast Walsh-Hadamard Inverse -->
  <rect x="130" y="500" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="517" text-anchor="middle" class="sub-label">Fast Walsh-Hadamard Inverse</text>
  <line x1="290" y1="542" x2="290" y2="528" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Gated Spectral Mixer -->
  <rect x="130" y="542" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="559" text-anchor="middle" class="sub-label">Gated Spectral Mixer</text>
  <line x1="290" y1="584" x2="290" y2="570" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Fast Walsh-Hadamard Transform -->
  <rect x="130" y="584" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="601" text-anchor="middle" class="sub-label">Fast Walsh-Hadamard Transform</text>
  <line x1="290" y1="626" x2="290" y2="612" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (wavelet_decomp_norm: per-scale, after decompose, before FWHT) -->
  <rect x="130" y="626" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="643" text-anchor="middle" class="sub-label">LayerNorm</text>
  <line x1="290" y1="668" x2="290" y2="654" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- Lifting Wavelet Decompose -->
  <rect x="130" y="668" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="685" text-anchor="middle" class="sub-label">Lifting Wavelet Decompose</text>
  <line x1="290" y1="710" x2="290" y2="696" class="sub-arrow" marker-end="url(#ab)"/>

  <!-- LayerNorm (ln1, pre-wavelet block input) -->
  <rect x="130" y="710" width="320" height="26" rx="4" ry="4" class="sub-box"/>
  <text x="290" y="727" text-anchor="middle" class="sub-label">LayerNorm</text>

  <!-- arrow: Embedding -> Block (entering input side) -->
  <line x1="290" y1="780" x2="290" y2="752" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Learned Embedding ===== -->
  <rect x="140" y="780" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="800" text-anchor="middle" class="label">Learned Embedding (C)</text>

  <!-- arrow: Input tokens -> Embedding -->
  <line x1="290" y1="844" x2="290" y2="816" class="arrow" marker-end="url(#ar)"/>

  <!-- ===== Input tokens (BOTTOM) ===== -->
  <rect x="140" y="844" width="300" height="32" rx="6" ry="6" class="box"/>
  <text x="290" y="864" text-anchor="middle" class="label">Input tokens</text>
</svg>
